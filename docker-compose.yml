services:
  postgres:
    build:
      context: ./infra/postgres
    container_name: lotiado-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lotiado}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lotiado}
      POSTGRES_DB: ${POSTGRES_DB:-lotiado}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-lotiado} -d $${POSTGRES_DB:-lotiado}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: lotiado-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  ollama:
    image: ollama/ollama:latest
    container_name: lotiado-ollama
    restart: unless-stopped
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # adobe/s3mock no lugar do MinIO real: a imagem quay.io/minio/minio (e
  # minio/minio no Docker Hub) passou a exigir login para pull anônimo em
  # 2026 — quebra tanto CI quanto `docker compose up` num clone novo. Ver
  # docs/03-decisoes-tecnicas.md. Sem volume nomeado (s3mock não persiste
  # em disco por padrão; ok para o escopo do projeto — dados de teste, não
  # produção). Não tem console web (a diferença de MinIO); administre pelo
  # `mc`/API S3 direto se precisar inspecionar objetos manualmente.
  minio:
    image: adobe/s3mock:latest
    container_name: lotiado-minio
    restart: unless-stopped
    ports:
      - "${MINIO_API_PORT:-9090}:9090"
    healthcheck:
      # A imagem (buildpacks, sem curl) só tem wget.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9090"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  worker:
    build:
      context: .
      dockerfile: ./infra/worker/Dockerfile
    container_name: lotiado-worker
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      # Hostnames de serviço da rede do compose (não `localhost`, usado pelo
      # backend rodando no host — ver app/config.py) — o worker é o único
      # processo da aplicação que roda containerizado por enquanto.
      DATABASE_URL: postgresql+asyncpg://lotiado_app:lotiado_app@postgres:5432/${POSTGRES_DB:-lotiado}
      REDIS_URL: redis://redis:6379/0
      OLLAMA_BASE_URL: http://ollama:11434
      MINIO_ENDPOINT_URL: http://minio:9090
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-lotiado}

  minio-init:
    image: curlimages/curl:latest
    container_name: lotiado-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_BUCKET: ${MINIO_BUCKET:-lotiado}
    entrypoint: ["/bin/sh", "/init/create-bucket.sh"]
    volumes:
      - ./infra/minio/init:/init:ro
    restart: "no"

volumes:
  postgres_data:
  redis_data:
  ollama_data:
